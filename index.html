<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해피데이 · 사무실</title>
<style>
  :root{
    --navy:#1F2A44; --navyBg:#EEF1F7;
    --teal:#14957A; --tealBg:#E6F5F1;
    --coral:#E2603A; --coralBg:#FCEDE8;
    --blue:#2C6FD1; --blueBg:#E8F0FC;
    --amber:#C98A16; --amberBg:#FDF3E0;
    --purple:#6B4FBB; --purpleBg:#EFEBFA;
    --line:#DDE2EA; --muted:#7A8598; --bg:#F6F8FB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--navy);font-size:17px;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    padding:0 0 40px}
  .top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
    padding:12px 14px 0}
  .top h1{margin:0 0 10px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
  .top h1 .r{margin-left:auto;font-size:13.5px;font-weight:600;opacity:.7}
  /* 탭 — 폭이 모자라면 저절로 아랫줄로. 옆으로 미는 스크롤을 쓰지 않는다.
     메뉴가 여덟 개, 열 개로 늘어도 전부 한눈에 보인다. */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;overflow:visible;padding-bottom:0}
  .tab{border:none;background:transparent;color:rgba(255,255,255,.6);
    padding:10px 14px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;
    white-space:nowrap;border-bottom:3px solid transparent;flex:0 0 auto}
  .tab.on{color:#fff;border-bottom-color:#7DD3FC}
  @media (max-width:560px){
    .tabs{gap:2px}
    /* 폭을 고정해 왼쪽부터 채운다. 마지막 한 개가 남는 폭을 먹지 않게 */
    .tab{flex:0 0 calc(25% - 2px);padding:9px 2px;font-size:16.5px;text-align:center}
    .tab .b{margin-left:3px;font-size:13.5px;min-width:14px;padding:0 4px}
  }
  @media (max-width:340px){ .tab{flex:0 0 calc(33.333% - 2px);font-size:15px} }
  .tab .b{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;
    background:rgba(255,255,255,.2);border-radius:9px;font-size:13.5px;line-height:17px;text-align:center}
  .tab.on .b{background:#7DD3FC;color:var(--navy)}

  .wrap{max-width:640px;margin:0 auto;padding:14px 12px 0}

  /* 통계 상자 — 상단바(네이비)와 붙어 보이지 않게 흰 카드로 */
  .stats{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:14px;
    padding:16px 16px 14px;margin-bottom:12px}
  .stats .row1{display:flex;gap:8px;margin-bottom:12px}
  .stats .pill{flex:1;background:var(--acBg,var(--navyBg));border-radius:11px;padding:11px 8px;text-align:center}
  .stats .pill .n{font-size:26px;font-weight:900;letter-spacing:-.5px;color:var(--ac,var(--navy))}
  .stats .pill .l{font-size:14px;color:var(--muted);margin-top:4px;font-weight:800}
  .stats .ch-title{font-size:14px;color:var(--muted);font-weight:800;margin-bottom:7px}
  .stats .chs{display:flex;flex-wrap:wrap;gap:6px}
  .stats .ch{background:var(--acBg,var(--navyBg));color:var(--navy);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700}
  .stats .ch b{color:var(--ac,var(--teal));margin-left:3px}
  .searchbar{position:relative;margin-bottom:10px}
  /* 검색창 — 회색 바탕. 흰 카드(보는 것)와 확실히 갈린다 */
  .searchbar input{width:100%;box-sizing:border-box;font-size:17px;padding:13px 40px 13px 14px;
    border-radius:11px;border:1.5px solid transparent;outline:none;font-family:inherit;
    background:#E9EDF3;color:var(--navy);transition:background .15s,border-color .15s}
  .searchbar input::placeholder{color:#8B95A6}
  .searchbar input:focus{background:#fff;border-color:var(--teal)}

  /* ═══ 마무리 — 눈에 안 띄지만 완성도를 만드는 것들 ═══ */

  /* 누르면 살짝 눌리는 느낌. 폰에서 「눌렸나?」 헷갈리지 않게 */
  .tab,.st,.st2,.hchip,.btn-refresh,.a,.hrow{transition:background .14s,color .14s,border-color .14s,transform .08s}
  .st:active,.st2:active,.hchip:active,.a:active,.btn-refresh:active{transform:scale(.97)}

  /* 탭을 옮길 때 내용이 툭 나타나지 않게 */
  #pane-quote,#pane-refer,#pane-review,#pane-hit,#pane-gate{animation:fadeUp .18s ease-out}
  @keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* 폰 아래 홈바에 내용이 가리지 않게 */
  .wrap{padding-bottom:calc(20px + env(safe-area-inset-bottom))}

  /* 키보드로 옮겨 다닐 때 지금 어디인지 보이게 */
  .tab:focus-visible,.st:focus-visible,.hchip:focus-visible,.a:focus-visible,
  .searchbar input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* 긴 목록을 스크롤할 때 표 머리가 붙어 있게 */
  .ctab th,.mtab th{position:sticky;top:0;z-index:1}

  /* 숫자는 자릿수가 흔들리지 않게 */
  .stats .pill .n,.rvstat .avg,.hgcol .v,.hitrow .pc,.ctab td{font-variant-numeric:tabular-nums}

  /* 글자를 끌어 선택할 때 파란 기본색 대신 우리 색 */
  ::selection{background:var(--tealBg);color:var(--navy)}
  .searchbar input:focus{border-color:var(--navy)}
  .qclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:none;background:var(--navyBg);color:var(--muted);border-radius:999px;
    width:26px;height:26px;font-size:15px;cursor:pointer;font-family:inherit}
  .subtabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .st{border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:999px;padding:8px 15px;font-size:16.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .st.on{background:var(--ac,var(--teal));color:#fff;border-color:var(--ac,var(--teal))}
  /* ★v2 : 2단 상세 칩 (소개자·부동산 등) */
  .subtabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;
    background:var(--navyBg);border-radius:11px;padding:10px 11px}
  .subtabs2 .lbl2{width:100%;font-size:14px;font-weight:800;color:var(--muted);margin-bottom:2px}
  .st2{border:1px solid #C9D3E4;background:#fff;color:var(--navy);
    border-radius:999px;padding:7px 13px;font-size:16.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .st2.on{background:var(--ac,var(--teal));color:#fff;border-color:var(--ac,var(--teal))}

  .bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .bar .cnt{font-size:16.5px;color:var(--muted);font-weight:700}
  .btn-refresh{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--navy);
    border-radius:8px;padding:9px 15px;font-size:16.5px;font-weight:800;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:5px}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:17px;margin-bottom:13px}
  .chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .way{border-radius:7px;padding:4px 11px;font-size:15px;font-weight:800}
  .mode{border-radius:7px;padding:4px 11px;font-size:15px;font-weight:800;
    background:var(--navyBg);color:var(--navy)}
  .mode.f{background:var(--coralBg);color:var(--coral)}
  .tel{font-size:18px;font-weight:800}
  .when{margin-left:auto;font-size:15px;color:var(--muted)}

  .move{font-size:17px;font-weight:800;margin:9px 0 3px;color:var(--navy)}
  .route{font-size:17px;line-height:1.65;color:#33415A}
  .route b{color:var(--navy)}
  .cond{font-size:14px;color:var(--teal);font-weight:700}
  .rows{margin-top:9px;display:grid;gap:3px}
  .kv{font-size:17px;line-height:1.55;color:#33415A}
  .kv .k{color:var(--muted);font-weight:700;margin-right:5px}
  /* ★v2 : 소개자 줄 */
  .refline{margin-top:9px;background:var(--purpleBg);color:#4B3690;border-radius:8px;
    padding:10px 13px;font-size:17px;line-height:1.5;font-weight:700}
  .warn{margin-top:9px;background:var(--coralBg);color:#993C1D;border-radius:8px;
    padding:10px 13px;font-size:16.5px;line-height:1.5}
  .note{margin-top:9px;background:var(--amberBg);color:#8A5F0B;border-radius:8px;
    padding:10px 13px;font-size:17px;line-height:1.55}
  .photo{margin-top:9px;font-size:17px}
  .photo a{color:var(--blue);font-weight:700;text-decoration:none}

  .acts{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
  .a{border:none;border-radius:9px;padding:12px 14px;font-size:17px;font-weight:800;
    cursor:pointer;font-family:inherit}
  .a.main{background:var(--navy);color:#fff;flex:1;min-width:150px}
  .a.tel{background:var(--teal);color:#fff}
  .a.sub{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .a.copied{background:var(--teal);color:#fff}
  .a.draft{background:var(--blue);color:#fff;flex:1;min-width:150px}
  .ch.st-wait{background:#FDF3E0;color:#8A5F0B}
  .ch.st-done{background:#E6F5F1;color:#0F6E56}
  .chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .chips .ch{border-radius:7px;padding:4px 11px;font-size:15px;font-weight:800}
  .ph{font-size:17px;font-weight:800}

  .chips2{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
  .cc{border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:8px;padding:9px 13px;font-size:16.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .cc:active,.cc.copied{background:var(--tealBg);color:#0F6E56;border-color:var(--teal)}

  /* ★v2 : 소개 대장 */
  .ledger{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:13px}
  .ledger h3{margin:0 0 11px;font-size:17px;font-weight:800}
  .lrow{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #EEF1F5}
  .lrow:last-child{border-bottom:none}
  .lrow .nm{font-weight:800;font-size:17px}
  .lrow .sub{font-size:15px;color:var(--muted);font-weight:700;margin-top:2px}
  .lrow .cn{margin-left:auto;background:var(--purpleBg);color:#4B3690;border-radius:999px;
    padding:6px 13px;font-size:16.5px;font-weight:800;white-space:nowrap}

  /* ★v2 : 후기 */
  /* 통계 상자 — 네 탭 모두 같은 모양(흰 카드). 상단바와 붙어 보이지 않게 */
  .rvstat{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:14px;
    padding:16px 16px 14px;margin-bottom:12px;display:none}
  .rvstat .big{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
  .rvstat .stars{color:#E3B34A;font-size:26px;letter-spacing:2px}
  .rvstat .avg{font-size:34px;font-weight:900;letter-spacing:-1px;color:var(--ac,var(--navy))}
  .rvstat .avg small{font-size:16.5px;font-weight:700;color:var(--muted);margin-left:4px}
  .rvstat .row{display:flex;flex-wrap:wrap;gap:7px}
  .rvstat .cell.clickable{cursor:pointer;transition:transform .1s,box-shadow .1s}
  .rvstat .cell.clickable:active{transform:scale(.96)}
  .rvstat .cell.picked{outline:2px solid var(--teal);outline-offset:1px}
  .rvstat .cell{background:var(--acBg,var(--navyBg));border-radius:999px;padding:8px 14px;
    font-size:16.5px;font-weight:800;color:var(--navy)}
  .rvstat .cell b{color:var(--ac,var(--teal));margin-left:5px;font-size:17px}
  .rvstat .cell.warn{background:var(--coralBg);color:var(--coral)}
  .rvstat .cell.warn b{color:var(--coral);font-size:17px}
  .rv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px}
  .rv .rvh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
  .rv .src{border-radius:7px;padding:4px 10px;font-size:14px;font-weight:900}
  .rv .src.sg{background:#EDE9FE;color:#5B21B6}
  .rv .src.nv{background:#E3F5E6;color:#15803D}
  .rv .src.kk{background:#FEF6D9;color:#8A6A12}
  .rv .src.dr{background:var(--tealBg);color:#0F766E}
  .rv .dt{background:var(--navyBg);color:var(--muted);border-radius:7px;padding:4px 10px;font-size:14px;font-weight:700}
  .rv .stars{color:#E3B34A;font-size:16.5px;letter-spacing:2px}
  .rv .meta{background:var(--bg);border-radius:9px;padding:10px 12px;margin-bottom:9px;
    display:grid;gap:4px;font-size:16.5px;color:#33415A}
  .rv .meta .mk{display:inline-block;min-width:56px;color:var(--muted);font-weight:800;margin-right:6px}
  .rv .meta i{color:#B6C0CC;font-style:normal}
  .rv .meta a{color:var(--blue);font-weight:800;text-decoration:none}
  .rv .asis{color:var(--coral);font-weight:800;font-size:14px}
  .rv .rtaghead{font-size:14px;font-weight:800;color:var(--muted);margin-top:10px}
  .rv .scores{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
  .rv .sc{display:flex;align-items:center;gap:7px;background:var(--tealBg);border-radius:8px;padding:7px 10px}
  .rv .sc .sn{flex:1;min-width:0;font-size:15px;font-weight:800;color:#0F6E56}
  .rv .sc .sv{font-size:17px;font-weight:900;color:var(--navy)}
  .rv .rtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .rv .rtags span{background:var(--navyBg);color:var(--navy);border-radius:7px;padding:5px 9px;
    font-size:14px;font-weight:800}
  .rv .tx{font-size:17px;line-height:1.65;color:#33415A}
  .rv .who{font-size:15px;color:var(--muted);font-weight:700;margin-top:7px}
  .rv.off{background:#F3F5F8;border:1px solid #E4C7BE;border-left:6px solid var(--coral);position:relative}
  .rv.off .tx,.rv.off .stars,.rv.off .who,.rv.off .src{filter:grayscale(1);opacity:.5}
  .rv.off .offbadge{display:inline-block;background:var(--coral);color:#fff;border-radius:7px;
    padding:5px 11px;font-size:15px;font-weight:900}
  .rv .onbadge{display:inline-block;background:var(--teal);color:#fff;border-radius:7px;
    padding:5px 11px;font-size:15px;font-weight:900}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .big{font-size:17px;font-weight:800;margin-bottom:6px;color:var(--navy)}
  .loading{text-align:center;padding:50px 20px;color:var(--muted);font-size:15px}
  .soon{text-align:center;padding:44px 20px;color:var(--muted)}

  /* ═══ 탭마다 성격을 주는 색 — 왼쪽 4px 띠와 숫자에만 쓴다
     면적이 작아 요란하지 않으면서 어느 탭인지 바로 알 수 있다 ═══ */
  #pane-quote    { --ac:var(--navy);  --acBg:var(--navyBg); }
  #pane-refer    { --ac:var(--teal);  --acBg:var(--tealBg); }
  #pane-gate { --ac:#1D9E75; --acBg:#E1F5EE; }
  #pane-review   { --ac:var(--amber); --acBg:var(--amberBg); }
  #pane-hit      { --ac:var(--blue);  --acBg:var(--blueBg); }
  #pane-stat     { --ac:var(--purple); --acBg:var(--purpleBg); }

  /* 카드·통계상자 왼쪽 띠 */
  .stats, .rvstat, .card{position:relative;overflow:hidden}
  .stats::before, .rvstat::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;
    background:var(--ac,var(--navy));border-radius:0 3px 3px 0}
  .stats, .rvstat{padding-left:20px}
  /* ═══ 반응 탭 ═══ */
  .hitrange{display:flex;justify-content:flex-start;gap:6px;flex-wrap:wrap;
    margin:4px 0 8px;text-align:left}
  /* 어느 날짜를 보고 있는지 항상 적는다 — 칩만 있으면 언제인지 모른다 */
  /* 어느 기간을 보고 있는지 — 작으면 안 읽힌다 */
  .range{font-size:17px;font-weight:800;color:var(--navy);margin:0 2px 12px;letter-spacing:-.4px}
  .range b{color:var(--ac,var(--navy));margin-right:7px}
  .range span{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:-.2px}
  .range .bs{margin-left:8px;padding:3px 9px;border-radius:999px;
    background:var(--acBg,var(--navyBg));color:var(--ac,var(--navy));font-size:13.5px;font-weight:800}

  /* ═══ 기간 고르기 — 월·분기·반기·연도 ═══ */
  .pbar{margin:2px 0 12px}
  .prow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .prow.sub{margin-top:6px}
  .prow.bas{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .plbl{font-size:14px;font-weight:800;color:var(--muted);margin-right:3px}
  .pchip{border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:999px;padding:7px 15px;font-size:16.5px;font-weight:800;
    cursor:pointer;font-family:inherit;flex:0 0 auto;letter-spacing:-.3px}
  .pchip.on{background:var(--ac,var(--navy));border-color:var(--ac,var(--navy));color:#fff}
  .pchip.sm{padding:6px 12px;font-size:14px;font-weight:700}
  .pchip.sm.on{background:var(--acBg,var(--navyBg));border-color:var(--ac,var(--navy));
    color:var(--ac,var(--navy))}
  @media (max-width:480px){
    .prow{gap:4px}
    .pchip{padding:7px 11px;font-size:14px}
    .pchip.sm{padding:6px 9px;font-size:14px}
  }
  /* 출처 칩 — 기간 칩보다 한 단계 작게. 무엇이 상위인지 보이게 */
  #hitFrom{margin:0 0 8px}
  #hitFrom .hchip{padding:5px 11px;font-size:14px}
  .hchip{border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:999px;padding:7px 13px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;flex:0 0 auto}
  /* 고른 칸은 teal — 상단바 네이비와 색이 겹치지 않게 */
  .hchip.on{background:var(--ac,var(--teal));border-color:var(--ac,var(--teal));color:#fff}
  @media (max-width:480px){
    .hitrange{gap:4px}
    .hchip{padding:7px 9px;font-size:14px}
  }
  @media (max-width:360px){ .hchip{padding:6px 7px;font-size:14px} }
  .hitbar{height:9px;background:var(--navyBg);border-radius:5px;overflow:hidden;margin-top:6px}
  .hitbar i{display:block;height:100%;background:var(--ac,var(--teal));border-radius:5px}
  .hitrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .hitrow:last-child{border-bottom:none}
  .hitrow .nm{flex:1;min-width:0}
  .hitrow .nm b{display:block;font-size:17px;font-weight:800;color:var(--navy)}
  .hitrow .nm span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
  .hitrow .pc{flex:0 0 62px;text-align:right;font-size:21px;font-weight:800;color:var(--navy)}
  .hitrow .pc em{font-style:normal;font-size:14px;color:var(--muted);margin-left:1px}
  .hitab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .hitab>div{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center}

<body>

<!-- 잠금 화면 -->
<div id="gate" class="gate">

</div>

<!-- 본 화면 -->
<div id="app" class="hide">
  <div class="top">
    <h1>해피데이 · 사무실 <span style="font-size:13.5px;font-weight:700;opacity:.55;margin-left:6px">v35 · 0909-1915</span><span class="r" id="clock"></span><button onclick="forgetKey()" style="margin-left:10px;border:none;background:rgba(255,255,255,.15);color:#fff;border-radius:7px;padding:5px 10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">잠그기</button></h1>

<script>
/* ═══════════ 설정 ═══════════ */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwdKDnhpG_Rhz3eggY196xFToRROetORZVkAs8mZNRemiuDWknQhzCd6aDmBsUNqSEF/exec';
/* ═══════════════════════════ */

var KEY = '';
var QUOTE = [];
var FILTER = 'all';    /* 유입경로 대분류 */
var FILTER2 = 'all';   /* 그 안의 상세 (소개자·부동산 이름) */
var SEARCH = '';
var PAGE = 50;
var SHOWN = 50;

/* ═══════════ ★v2 유입경로 정리 ═══════════
   시트 값 : 지인소개(김민균(김관홍님 친구))
   → 대분류 : 지인소개      (칩은 이것으로 묶임)
   → 상세   : 김민균(김관홍님 친구)
   앱스크립트 v25 가 이미 나눠 보내주면 그것을 그대로 쓰고,
   예전 값이 통째로 오면 여기서 나눕니다. */
var GATHER_MAIN=['숨고','블로그','부동산소개','지인소개','인터넷검색','카페추천',
                 '재구매','인스타그램','당근','카카오','네이버','전단지','기타'];

function gatherOf(r){
  var raw=String(r['유입경로원본']||r['유입경로']||'').trim();
  var main=String(r['유입경로']||'').trim();
  var detail=String(r['유입경로상세']||'').trim();

  if(!detail && raw.indexOf('(')>0){          /* 아직 안 나뉜 예전 값 */
    var p=raw.indexOf('(');
    main   = raw.slice(0,p).trim();
    detail = raw.slice(p+1).replace(/\)\s*$/,'').trim();
  }
  if(GATHER_MAIN.indexOf(main)===-1){
    for(var i=0;i<GATHER_MAIN.length;i++){
      if(main.indexOf(GATHER_MAIN[i])===0){
        detail=(main.slice(GATHER_MAIN[i].length).trim()+' '+detail).trim();
        main=GATHER_MAIN[i]; break;
      }
    }
  }
  /* 소개자 칸이 따로 있으면 그쪽을 상세로 */
  var nm=String(r['소개자성함']||'').trim(), ph=String(r['소개자연락처']||'').trim();
  if(!detail && (nm||ph)) detail=(nm+' '+ph).trim();

  return { main: main||'기타', detail: detail };
}

/* 유입경로 색 */
function wayStyle(w){
  var m={
    '숨고':['#E6F5F1','#0F6E56'], '지인소개':['#EFEBFA','#6B4FBB'], '소개':['#EFEBFA','#6B4FBB'],
    '재구매':['#FDF3E0','#8A5F0B'], '부동산소개':['#E8F0FC','#2C6FD1'],
    '인터넷검색':['#EEF1F7','#1F2A44'], '카페추천':['#FCEDE8','#993C1D'],
    '당근':['#FDF3E0','#8A5F0B'], '카카오':['#FDF3E0','#8A5F0B'],
    '인스타그램':['#FCEDE8','#993C1D'], '블로그':['#E8F0FC','#2C6FD1']
  };
  var c = m[w] || ['#EEF1F7','#1F2A44'];
  return 'background:'+c[0]+';color:'+c[1];
}

function unlock(){
  var k = document.getElementById('keyInput').value.trim();
  if(!k){ return; }
  KEY = k;
  document.getElementById('gateErr').classList.add('hide');
  openApp();
}

function openApp(){
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  tick(); setInterval(tick, 30000);
  loadQuote();
}

function rememberKey(k){ try{ localStorage.setItem('office_key', k); }catch(e){} }
function forgetKey(){ try{ localStorage.removeItem('office_key'); }catch(e){} KEY=''; location.reload(); }
function tryAutoLogin(){
  var saved=''; try{ saved=localStorage.getItem('office_key')||''; }catch(e){}
  if(saved){ KEY=saved; openApp(); }
}

function tick(){
  var d=new Date();
  var s=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  document.getElementById('clock').textContent=s+' 기준';
}

/* 탭 전환 */
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    var tab=t.dataset.tab;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===t);});
    ['quote','refer','review','hit','gate','stat'].forEach(function(k){
      document.getElementById('pane-'+k).classList.toggle('hide',k!==tab);
    });
    if(tab==='refer'){ renderReferAll(); if(!REFER_LOADED) loadRefer(); }
    if(tab==='hit'){ loadHit(); }
    if(tab==='stat'){ renderStatTab(); }
    if(tab==='gate'){ loadGate(); }
    if(tab==='review'){ if(!REVIEW_LOADED) loadReview(); if(!RATING_LOADED) loadRating2(); }
  };
});

/* ═══════════ 소개 — 오더를 물어다 주신 분 대장 ═══════════
   기준은 견적신청 시트(QUOTE). 지인소개 + 부동산소개를 함께 봅니다.
   소개신청 시트(REFER)는 '아직 견적 안 낸 소개'로 아래에 따로 보여줍니다. */
var REFER=[]; var REFER_LOADED=false;
var LGFILTER='all';   /* all | 지인소개 | 부동산소개 */

/* ═══════════════════════════════════════════════════════
   반응 탭 — 견적링크에서 손님이 어디를 눌렀나
   ═══════════════════════════════════════════════════════ */
var HIT_DAYS = '1';

var HIT_YM='';   /* 월별에서 고른 달. 비어 있으면 표 전체 */
var HIT_F='';    /* 어디서 온 손님만 볼지. 비어 있으면 전체 */

/* 날짜를 사람 말로 — 2026-08-21 → 8/21 */
function dmd(v){
  var m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m? (Number(m[2])+'/'+Number(m[3])) : '';
}
function dfull(v){
  var m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  var w=['일','월','화','수','목','금','토'][new Date(v).getDay()];
  return Number(m[1])+'년 '+Number(m[2])+'월 '+Number(m[3])+'일 ('+w+')';
}

/* 어디서 온 손님인지 갈라 보는 칩 — 숨고·블로그·인스타는 주소에 표시가 붙는다.
   표시가 없으면 문자씨(콜백)로 본다. */
function renderFroms(list){
  var el=document.getElementById('hitFrom');
  if(!el) return;
  if(!list||!list.length){ el.innerHTML=''; return; }
  var tot=0; list.forEach(function(x){ tot+=x.people||0; });
  var h='<button type="button" class="hchip'+(HIT_F?'':' on')+'" data-f="">전체 '+tot+'</button>';
  list.forEach(function(x){
    h+='<button type="button" class="hchip'+(HIT_F===x.name?' on':'')+'" data-f="'+esc(x.name)+'">'+
       esc(x.name)+' '+(x.people||0)+'</button>';
  });
  el.innerHTML=h;
}

function setHitRange(txt){
  var el=document.getElementById('hitRangeTxt');
  if(el) el.textContent=txt||'';
}

/* ★v31 — 한 번 받은 것을 담아둔다. 다시 누르면 즉시 보여주고 뒤에서 새로 받는다 */
var HIT_CACHE={};
function hitKey(){ return HIT_DAYS+'|'+HIT_YM+'|'+HIT_F; }

/* ★v31 — 화면을 지우지 않는다. 위에 얇은 띠만 띄운다 */
function busyOn(){
  var el=document.getElementById('hitBody');
  if(!el) return;
  if(el.querySelector('.loadbar')) return;
  if(!el.innerHTML.trim()){
    el.innerHTML='<div class="loading">견적링크 반응을 읽는 중입니다…</div>';
    return;
  }
  var b=document.createElement('div');
  b.className='loadbar'; b.textContent='새로 받는 중…';
  el.insertBefore(b, el.firstChild);
}
function busyOff(){
  var el=document.getElementById('hitBody');
  if(!el) return;
  var b=el.querySelector('.loadbar');
  if(b) b.parentNode.removeChild(b);
}

/* ★v32 — 주소에 ?demo=1 이 붙었을 때만 가짜 자료로 그린다.
   올리기 전에 이 파일 그대로 미리보기로 확인할 수 있게 하는 장치다.
   ?demo=1 이 없으면 절대 뜨지 않는다. */
var DEMO = /[?&]demo=1/.test(location.search);
function demoMonth(){
  var now=new Date(), out=[];
  var base=[[180,92,48,118,84,71,33,19],[205,108,56,134,96,80,38,22],
            [232,121,63,152,108,92,41,25],[261,138,72,171,122,104,46,28]];
  for(var i=0;i<4;i++){
    var d=new Date(now.getFullYear(), now.getMonth()-3+i, 1);
    var ym=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
    var v=base[i], home=v[0];
    out.push({'달':ym,'홈 열림':v[0],'견적 신청하기':v[1],'견적 전송 누름':v[2],
      '왜 청소가 공짜지':v[3],'7 · 5':v[4],'고객 후기':v[5],'회사 소개':v[6],'지인에게':v[7],
      '청소 전환율(%)':Math.round(v[3]/home*1000)/10,
      '7·5 전환율(%)':Math.round(v[4]/home*1000)/10,
      '후기 전환율(%)':Math.round(v[5]/home*1000)/10,
      '아무것도 안 본 전환율(%)':Math.round((home*0.16)/home*1000)/10});
  }
  return out.reverse();   /* 시트는 최신이 위 */
}

function loadHit(){
  var ck=hitKey(), had=HIT_CACHE[ck];
  if(had){ document.getElementById('hitBody').innerHTML=had; }
  busyOn();
  if(HIT_DAYS==='month'){
    if(HIT_YM){
      /* 달을 골랐으면 그 달만 자세히 */
      setHitRange('');
      fetch(GAS_URL+'?key='+encodeURIComponent(KEY)+'&tab=logOne&ym='+encodeURIComponent(HIT_YM+'&_='+Date.now())+'&f='+encodeURIComponent(HIT_F))
        .then(function(r){return r.json();}).then(function(res){
          renderHit(res && res.ok ? res : null, true); hitSave();
        }).catch(function(){ renderHit(null,true); busyOff(); });
      return;
    }
    setHitRange('달마다 한 줄씩 · 지우지 않고 계속 쌓입니다');
    if(DEMO){ renderMonth(demoMonth()); hitSave(); return; }
    fetch(GAS_URL+'?key='+encodeURIComponent(KEY)+'&tab=logMonth'+'&_='+Date.now())
      .then(function(r){return r.json();})
      .then(function(res){ renderMonth(res && res.ok ? res.rows : null); hitSave(); })
      .catch(function(){ renderMonth(null); busyOff(); });
    return;
  }
  var url=GAS_URL+'?key='+encodeURIComponent(KEY)+'&tab=logStat&days='+HIT_DAYS+'&f='+encodeURIComponent(HIT_F);
  fetch(url+'&_='+Date.now()).then(function(r){return r.json();}).then(function(res){
    renderHit(res && res.ok ? res : null); hitSave();
  }).catch(function(){ renderHit(null); busyOff(); });
}

/* 월별 — 세로가 항목, 가로가 달. 옆으로 밀지 않는다 (v31)
   화면규칙서 4-4-2 「열이 여덟을 넘으면 표를 뒤집는다」 */
var MON_N = 4;          /* 나란히 볼 달 수 */

/* 시트 열 이름(왼쪽)과 표에 보일 이름(오른쪽). 시트 이름은 바꾸지 않는다 */
var MCOLS=[
  {k:'홈 열림',         l:['홈열림']},
  {k:'견적 신청하기',   l:['견적','신청']},
  {k:'견적 전송 누름',  l:['전송','누름']},
  {k:'왜 청소가 공짜지',l:['청소','공짜']},
  {k:'7 · 5',          l:['7 · 5'], keep:1},
  {k:'고객 후기',       l:['고객','후기']},
  {k:'회사 소개',       l:['회사','소개']},
  {k:'지인에게',        l:['지인','에게']}
];
var MRATES=[
  {k:'청소 전환율(%)',           l:['청소','전환']},
  {k:'7·5 전환율(%)',            l:['7 · 5','전환'], keep:1},
  {k:'후기 전환율(%)',           l:['후기','전환']},
  {k:'아무것도 안 본 전환율(%)', l:['안본','전환']}
];

/* 낱글자를 양 끝으로 민다 — 「견적」 → 견   적 */
function mspread(t){
  var ch=String(t).replace(/\s+/g,'').split('');
  if(ch.length<2) return '<span class="ml one">'+esc(t)+'</span>';
  return '<span class="ml">'+ch.map(function(c){return '<i>'+esc(c)+'</i>';}).join('')+'</span>';
}
function mname(o){
  return o.l.map(function(t,i){
    return (o.keep && i===0) ? '<span class="ml one">'+esc(t)+'</span>' : mspread(t);
  }).join('');
}
function mdlt(now,prev){
  if(prev==null||isNaN(prev)) return '';
  var d=now-prev;
  if(!d) return '<span class="dlt">·0</span>';
  return '<span class="dlt '+(d>0?'up':'dn')+'">'+(d>0?'▲':'▼')+Math.abs(d)+'</span>';
}

/* 그린 뒤 담아둔다 */
function hitSave(){
  busyOff();
  var el=document.getElementById('hitBody');
  if(el) HIT_CACHE[hitKey()]=el.innerHTML;
}

function renderMonth(rows){
  var el=document.getElementById('hitBody');
  if(!rows){
    el.innerHTML='<div class="soon"><div class="big">읽지 못했습니다</div>'+
      '앱스크립트에 접속기록 코드가 들어갔는지 확인해 주세요.</div>';
    return;
  }
  /* 시트가 달을 날짜로 바꿔놨어도 2026-08 모양으로 되돌린다 */
  function ymTxt(v){
    var t=String(v||'').trim();
    var m=t.match(/^(\d{4})-(\d{2})/);
    if(m) return m[1]+'-'+m[2];
    var d=new Date(t);
    if(!isNaN(d.getTime())) return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
    return t;
  }
  /* ★v32 — 자료가 있든 없든 최근 넉 달 자리를 만든다. 없는 달은 0 */
  var now=new Date();
  var thisYm=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2);
  var by={}; rows.forEach(function(r){ by[ymTxt(r['달'])]=r; });

  var slots=[];
  for(var i=MON_N-1;i>=0;i--){
    var d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    var ym=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
    slots.push({ym:ym, r:by[ym]||null, has:!!by[ym]});
  }
  /* 넉 달보다 앞선 달도 시트에 있으면 버튼으로 내려 둔다 */
  var older=Object.keys(by).filter(function(k){
    return slots.every(function(s2){ return s2.ym!==k; });
  }).sort();

  /* 값 읽기 — 없는 달은 0 */
  function val(slot,key){
    if(!slot.has) return 0;
    var v=slot.r[key];
    if(v===''||v==null) return null;
    v=Number(v);
    return isNaN(v)?null:v;
  }

  var h='<div class="card">'+
    '<div class="sth">달마다 몇 명이 눌렀나</div>'+
    '<div class="sts">사람 수 기준 · 오른쪽이 최신 달</div>';

  h+='<table class="mt"><tr><th>항목</th>';
  slots.forEach(function(s2){
    var isNow=(s2.ym===thisYm);
    h+='<th class="'+(isNow?'now':'')+(s2.has?'':' none')+'">'+
       Number(s2.ym.slice(5))+'월'+
       (isNow?'<em>진행 중</em>':(s2.has?'':'<em>기록 없음</em>'))+'</th>';
  });
  h+='</tr>';

  MCOLS.forEach(function(o){
    h+='<tr><td class="nm">'+mname(o)+'</td>';
    slots.forEach(function(s2,i){
      var isNow=(s2.ym===thisYm);
      var v=val(s2,o.k);
      var pv=(i>0)?val(slots[i-1],o.k):null;
      var cell=(v===null)?'–':String(v);
      /* ★ 진행 중인 달에는 증감을 붙이지 않는다. 아직 안 끝났다 */
      if(!isNow && v!==null && pv!==null && slots[i-1].has) cell+=mdlt(v,pv);
      h+='<td class="'+(isNow?'now':'')+(s2.has?'':' none')+(v===0?' zero':'')+'">'+cell+'</td>';
    });
    h+='</tr>';
  });
  MRATES.forEach(function(o,ri){
    h+='<tr class="pc'+(ri===0?' gap':'')+'"><td class="nm">'+mname(o)+'</td>';
    slots.forEach(function(s2){
      var isNow=(s2.ym===thisYm);
      var v=s2.has?s2.r[o.k]:null;
      h+='<td class="'+(ri===3?'dim':'')+(isNow?' now':'')+(s2.has?'':' none')+'">'+
         ((v===''||v==null)?'–':(v+'%'))+'</td>';
    });
    h+='</tr>';
  });
  h+='</table>';

  /* 무엇이 왜 비어 있는지 적는다 */
  var msg=[];
  var none=slots.filter(function(s2){ return !s2.has; });
  if(none.length){
    msg.push('<b>'+none.map(function(s2){return Number(s2.ym.slice(5))+'월';}).join(' · ')+
             '</b>은 기록이 없어 0으로 둡니다. 견적링크 접속기록은 <b>2026년 8월부터</b> 쌓입니다.');
  }
  var cur=slots[slots.length-1];
  if(cur && cur.ym===thisYm){
    msg.push('<b>'+Number(thisYm.slice(5))+'월은 아직 진행 중</b>이라 지난달과 견주지 않습니다. '+
             '달이 끝나야 증감이 붙습니다.');
  }
  if(msg.length) h+='<div class="mnote">'+msg.join('<br>')+'</div>';

  if(older.length){
    h+='<div class="mnote">앞선 '+older.length+'달은 달을 눌러 보십시오</div><div class="myms">';
    older.forEach(function(ym){
      h+='<button type="button" class="ymbtn" data-ym="'+esc(ym)+'">'+esc(ym)+'</button>';
    });
    h+='</div>';
  }
  h+='</div>';
  el.innerHTML=h;
}

function renderHit(d,one){
  var el=document.getElementById('hitBody');
  if(!d){
    setHitRange('');
    el.innerHTML='<div class="soon"><div class="big">읽지 못했습니다</div>'+
      '견적링크가 아직 반응을 보내지 않았거나, 앱스크립트에 접속기록 코드가 안 들어갔습니다.</div>';
    document.getElementById('cnt-hit').textContent='–';
    return;
  }
  var open=d.opened||0;
  if(!one && !HIT_F) document.getElementById('cnt-hit').textContent=open;
  renderFroms(d.froms);

  /* ★ 어느 날짜를 보고 있는지 적는다 */
  if(one){
    setHitRange((d.ym||'')+' · '+dmd(d.from)+' ~ '+dmd(d.to));
  }else if(HIT_DAYS==='1'){
    setHitRange(dfull(d.to));
  }else if(d.from&&d.to){
    setHitRange('최근 '+HIT_DAYS+'일 · '+dmd(d.from)+' ~ '+dmd(d.to));
  }

  if(!open){
    el.innerHTML='<div class="soon"><div class="big">아직 기록이 없습니다</div>'+
      '이 기간에 견적링크를 연 사람이 없습니다.</div>';
    return;
  }

  var h='';
  h+='<div class="stats"><div style="font-size:14px;color:var(--muted);font-weight:800">견적링크를 연 사람</div>'+
     '<div style="font-size:38px;font-weight:800;letter-spacing:-1.5px;margin-top:4px;color:var(--navy)">'+open+
     '<span style="font-size:17px;font-weight:700;margin-left:3px;color:var(--muted)">명</span></div></div>';

  /* ★ 어디를 눌렀나 — 버튼 여섯 개는 0이어도 항상 보여준다 */
  var MAIN=[['form','견적 신청하기'],['free','왜 청소가 공짜지'],['data','7 · 5'],
            ['company','회사 소개'],['review','고객 후기'],['refer','지인에게']];
  var SUB =[['견적전송시작','견적 전송 누름'],['전화_상단','전화 (상단바)'],['전화_하단','전화 (하단바)']];
  var byKey={};
  (d.rows||[]).forEach(function(r){ byKey[r.key]=r; });

  function rowHtml(k,name){
    var r=byKey[k]||{people:0,hits:0,rate:0};
    var w=Math.min(100, r.rate||0);
    var dim=(r.people?'':' style="opacity:.45"');
    return '<div class="hitrow"'+dim+'><div class="nm"><b>'+esc(name)+'</b>'+
           '<span>'+(r.people||0)+'명 · '+(r.hits||0)+'번</span>'+
           '<div class="hitbar"><i style="width:'+w+'%"></i></div></div>'+
           '<div class="pc">'+(r.rate||0)+'<em>%</em></div></div>';
  }

  h+='<div class="card"><div style="font-size:16.5px;font-weight:800;color:var(--navy);margin-bottom:4px">'+
     '고객이 무엇을 궁금해했나</div>'+
     '<div style="font-size:14px;color:var(--muted);margin-bottom:8px">연 사람 '+open+'명 기준 · 사람 수</div>';

  /* 막대그래프 — 여섯 버튼을 한눈에 견준다 */
  var mx=0;
  MAIN.forEach(function(x){ var r=byKey[x[0]]; if(r&&r.people>mx) mx=r.people; });
  h+='<div class="hgraph">';
  MAIN.forEach(function(x){
    var r=byKey[x[0]]||{people:0};
    var hh=mx? Math.round((r.people/mx)*110) : 0;
    h+='<div class="hgcol'+(r.people?'':' zero')+'"><div class="v">'+(r.people||0)+'</div>'+
       '<div class="bar" style="height:'+hh+'px"></div></div>';
  });
  h+='</div><div class="hglbl">';
  MAIN.forEach(function(x){ h+='<div>'+esc(x[1])+'</div>'; });
  h+='</div><div style="height:10px"></div>';

  MAIN.forEach(function(x){ h+=rowHtml(x[0],x[1]); });
  h+='</div>';

  h+='<div class="card"><div style="font-size:16.5px;font-weight:800;color:var(--navy);margin-bottom:8px">'+
     '그 밖에</div>';
  SUB.forEach(function(x){ h+=rowHtml(x[0],x[1]); });
  h+='</div>';

  /* ★ 어느 화면을 본 사람이 견적을 넣었나 — 여섯을 같은 자로 잰다
     맨 아래 '아무것도 안 본 사람' 이 기준선. 그보다 높으면 그 화면이 일한 것. */
  var cv=d.conv||[], bs=d.base||null;
  if(cv.length){
    var thin=(open<30);
    h+='<div class="card"><div style="font-size:16.5px;font-weight:800;color:var(--navy);margin-bottom:4px">'+
       '무엇을 본 사람이 견적을 넣었나</div>'+
       '<div style="font-size:14px;color:var(--muted);margin-bottom:10px">'+
       (thin?'★ 아직 '+open+'명뿐입니다. 몇백 명은 쌓여야 뜻이 있습니다.'
            :'맨 아래 줄이 기준선입니다. 그보다 높으면 그 화면이 일한 것입니다.')+
       '</div><table class="ctab"><tr><th>본 화면</th><th>본 사람</th><th>견적</th><th>전환율</th></tr>';
    cv.slice().sort(function(x,y){ return (y.rate||0)-(x.rate||0); }).forEach(function(r){
      var over = bs && bs.people && r.people && (r.rate||0) > (bs.rate||0);
      h+='<tr'+(r.people?'':' style="opacity:.45"')+'>'+
         '<td class="nm">'+esc(r.name)+'</td>'+
         '<td>'+(r.people||0)+'</td><td>'+(r.quote||0)+'</td>'+
         '<td class="'+(over?'up':'')+'">'+(r.rate||0)+'%</td></tr>';
    });
    if(bs){
      h+='<tr class="base"><td class="nm">아무것도 안 본 사람</td>'+
         '<td>'+(bs.people||0)+'</td><td>'+(bs.quote||0)+'</td><td>'+(bs.rate||0)+'%</td></tr>';
    }

function renderReferStats(){
  var now=new Date();
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var cur=periodOf(PERIOD.unit,PERIOD.back);
  var prv=periodOf(PERIOD.unit,PERIOD.back+1);

  var cCur=0, cPrv=0, cJi=0, cBu=0;
  rows.forEach(function(r){

  h+='<div class="pill"><div class="n">'+cBu+'</div><div class="l">부동산 소개</div></div>';
  h+='</div>';
  h+='<div class="ch-title">소개로 온 문의 모두 '+rows.length+'건 · '+esc(prv.name)+' '+cPrv+'건</div>';
  document.getElementById('referStats').innerHTML=h;
}

/* 소개자 대장 — 지인 + 부동산 한 표에 */
function renderLedger(){
  var box=document.getElementById('referLedger');
  var rows=introRows();
  var by={};
  rows.forEach(function(r){
    var who=(r._detail||'(누구인지 미기재)');
    var key=r._main+'|'+who;
    if(!by[key]) by[key]={main:r._main, who:who, n:0, tel:String(r['소개자연락처']||'').trim()};
    by[key].n++;
    if(!by[key].tel && r['소개자연락처']) by[key].tel=String(r['소개자연락처']).trim();
  });
  var keys=Object.keys(by).filter(function(k){
    return LGFILTER==='all' || by[k].main===LGFILTER;
  }).sort(function(a,b){return by[b].n-by[a].n;});

  var nJi=0,nBu=0;
  Object.keys(by).forEach(function(k){ if(by[k].main==='지인소개') nJi++; else nBu++; });

  var h='<div class="subtabs">'
    +'<button class="st '+(LGFILTER==='all'?'on':'')+'" onclick="setLg(\'all\')">전체 '+(nJi+nBu)+'명</button>'
    +'<button class="st '+(LGFILTER==='지인소개'?'on':'')+'" onclick="setLg(\'지인소개\')">지인 '+nJi+'명</button>'
    +'<button class="st '+(LGFILTER==='부동산소개'?'on':'')+'" onclick="setLg(\'부동산소개\')">부동산 '+nBu+'명</button>'
    +'</div>';

  if(!keys.length){
    h+='<div class="ledger"><h3>오더를 물어다 주신 분</h3><div class="lrow"><div class="sub">아직 없습니다.</div></div></div>';
    box.innerHTML=h; return;
  }

  h+='<div class="ledger"><h3>오더를 물어다 주신 분 ('+keys.length+'명)</h3>';
  keys.forEach(function(k){
    var v=by[k];
    var tag = (v.main==='지인소개')
      ? '<span class="ch" style="background:#EFEBFA;color:#6B4FBB;border-radius:7px;padding:3px 9px;font-size:14px;font-weight:800">지인</span>'
      : '<span class="ch" style="background:#E8F0FC;color:#2C6FD1;border-radius:7px;padding:3px 9px;font-size:14px;font-weight:800">부동산</span>';
    h+='<div class="lrow"><div><div class="nm">'+tag+' '+esc(v.who)+'</div>'
      +(v.tel?'<div class="sub">'+esc(v.tel)+'</div>':'')
      +'</div><div class="cn">'+v.n+'건</div></div>';
  });
  h+='</div>';
  box.innerHTML=h;
}
function setLg(f){ LGFILTER=f; renderLedger(); }

var REVIEW=[]; var REVIEW_LOADED=false; var RVFILTER='all';
function loadReview(){
  document.getElementById('reviewList').innerHTML='<div class="loading">후기를 읽는 중입니다…</div>';
  document.getElementById('reviewCnt').textContent='불러오는 중…';

function setRvFilter(f){ RVFILTER=f; renderReview(); }

var SRCMAP={
  "숨고":{c:"sg",t:"숨고 인증 후기"}, "soomgo":{c:"sg",t:"숨고 인증 후기"},
  "네이버":{c:"nv",t:"네이버 후기"},  "naver":{c:"nv",t:"네이버 후기"},
  "카카오":{c:"kk",t:"카카오 후기"},  "당근":{c:"kk",t:"당근 후기"},
  "해피데이":{c:"dr",t:"해피데이 후기"}, "직접":{c:"dr",t:"해피데이 후기"}, "문자":{c:"dr",t:"해피데이 후기"}
};
function srcInfo(s){ s=String(s||"").trim(); return SRCMAP[s]||SRCMAP[s.toLowerCase()]||{c:"dr",t:s+" 후기"}; }
function srcClass(s){ return srcInfo(s).c; }
function srcLabel(s){ return esc(srcInfo(s).t); }

function renderReview(){
  var shown=REVIEW.filter(function(v){return v.open!=='N';}).length;
  var hidden=REVIEW.length-shown;
  var onlyStar=REVIEW.filter(function(v){return !v.text;}).length;
  document.getElementById('reviewCnt').textContent='손님에게 보이는 후기 '+shown+'건'
    +(hidden?' · 숨김 '+hidden+'건':'')+(onlyStar?' · 별점만 '+onlyStar+'건':'');

  var t='<button class="st '+(RVFILTER==='all'?'on':'')+'" onclick="setRvFilter(\'all\')">전체 '+REVIEW.length+'</button>'
       +'<button class="st '+(RVFILTER==='on'?'on':'')+'" onclick="setRvFilter(\'on\')">보이는 중 '+shown+'</button>'
       +'<button class="st '+(RVFILTER==='off'?'on':'')+'" onclick="setRvFilter(\'off\')">숨김 '+hidden+'</button>';
  document.getElementById('rvTabs').innerHTML=t;

  if(!REVIEW.length){
    document.getElementById('reviewList').innerHTML='<div class="empty"><div class="big">후기가 없습니다</div>[후기] 시트에 후기가 쌓이면 여기에 나타납니다.</div>';
    return;
  }
  var list=REVIEW.filter(function(v){
    if(RVFILTER==='on') return v.open!=='N';
    if(RVFILTER==='off') return v.open==='N';
    return true;
  }).sort(function(a,b){
    return String(b.date||b.moveDate||'').localeCompare(String(a.date||a.moveDate||''));
  });

  if(!list.length){
    document.getElementById('reviewList').innerHTML='<div class="empty"><div class="big">해당하는 후기가 없습니다</div></div>';
    return;
  }

  var h='';
  list.forEach(function(v){
    var raw=Number(v.star);
    var noStar=(!raw||isNaN(raw));
    if(raw<1)raw=1; if(raw>5)raw=5;
    var n=Math.round(raw), s='';
    for(var i=0;i<5;i++) s+= (i<n?'★':'☆');
    var num=noStar?'':(Math.round(raw*10)/10).toFixed(1);
    var off=(v.open==='N');

    h+='<div class="rv'+(off?' off':'')+'" id="rv'+v._row+'"><div class="rvh">';
    h+= off ? '<span class="offbadge">손님에게 안 보임</span>'
            : '<span class="onbadge">손님에게 보임</span>';
    if(v.source) h+='<span class="src '+srcClass(v.source)+'">'+srcLabel(v.source)+'</span>';
    h+='<span class="dt">'+v._row+'행</span>';
    h+='</div>';

    /* ★ 오피스는 원본 그대로 */
    h+='<div class="meta">';
    h+='<div><span class="mk">연락처</span>'+(v.tel?('<a href="tel:'+String(v.tel).replace(/\D/g,'')+'">'+esc(v.tel)+'</a>'):'<i>없음</i>')+'</div>';
    h+='<div><span class="mk">이사일</span>'+(v.moveDate?esc(fmtDate(v.moveDate)):'<i>없음</i>')+'</div>';
    h+='<div><span class="mk">후기일</span>'+(v.date?esc(fmtDate(v.date)):'<i>없음</i>')+'</div>';
    h+='<div><span class="mk">작성자</span>'+(v.who?esc(v.who):'<i>없음</i>')
      +((v.who&&v.whoShow&&v.who!==v.whoShow)?' <span class="asis">손님화면 : '+esc(v.whoShow)+'</span>':'')+'</div>';
    if(v.kind) h+='<div><span class="mk">이사종류</span>'+esc(v.kind)+'</div>';
    if(v.memo) h+='<div><span class="mk">비고</span>'+esc(v.memo)+'</div>';
    /* ★ 시트에 있는 나머지 칸 전부 (항목별 점수 등) */
    if(v.extra&&v.extra.length) v.extra.forEach(function(e){
      h+='<div><span class="mk">'+esc(e.k)+'</span>'+esc(e.v)+'</div>';
    });
    h+='</div>';

    h+='<div class="stars">'+s+(num?' <b style="color:var(--navy);font-size:17px">'+num+'</b>'
      :' <b style="color:#B6C0CC;font-size:15px">별점없음</b>')+'</div>';
    if(v.text) h+='<div class="tx">'+esc(v.text)+'</div>';
    else h+='<div class="tx" style="color:#9AA6B4">(글 없이 별점만 — 손님 화면에는 카드로 안 나가고 평균에만 반영됩니다)</div>';
    if(v.scores&&v.scores.length){
      h+='<div class="rtaghead">항목별 점수</div><div class="scores">';
      v.scores.forEach(function(x){
        h+='<div class="sc"><span class="sn">'+esc(x.k)+'</span><span class="sv">'+x.v+'</span></div>';
      });
      h+='</div>';
    }
    if(v.tags&&v.tags.length) h+='<div class="rtaghead">평가항목 '+v.tags.length+'개</div>'
      +'<div class="rtags">'+v.tags.map(function(t){return '<span>'+esc(t)+'</span>';}).join('')+'</div>';

    h+='<div class="acts"><button class="a '+(off?'tel':'sub')+'" style="flex:1" id="rb'+v._row+'" '
      +'onclick="toggleReview('+v._row+','+(off?1:0)+')">'+(off?'보이기':'숨기기')+'</button></div>';
    h+='</div>';
  });
  document.getElementById('reviewList').innerHTML=h;
}

function toggleReview(row, toOpen){
  var b=document.getElementById('rb'+row);
  var old=b?b.textContent:'';
  if(b){ b.disabled=true; b.textContent='바꾸는 중…'; }
  var open = toOpen ? 'Y' : 'N';
  fetch(GAS_URL+'?key='+encodeURIComponent(KEY)+'&tab=reviewSet&row='+row+'&open='+open+'&_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(res){
      if(!res.ok){ if(b){b.disabled=false;b.textContent=old;} alert('바꾸지 못했습니다 : '+(res.error||'')); return; }
      REVIEW.forEach(function(v){ if(v._row===row) v.open=open; });
      var cb=document.getElementById('cnt-review');
      if(cb) cb.textContent=REVIEW.filter(function(v){return v.open!=='N';}).length;
      renderReview(); renderRvStat();
    })
    .catch(function(e){ if(b){b.disabled=false;b.textContent=old;} alert('연결 오류 : '+e); });
}

/* ═══════════ ★v37 새 평가 (후기링크가 쌓은 것) ═══════════ */
var RATING=[], RATING_LOADED=false, RVMODE='pub';

function renderRvStat(){
  var box=document.getElementById('rvStat'); if(!box)return;

  /* 평가(후기링크로 들어온 것) 기준 — 점수만 준 고객까지 전부 */
  var n=0, sum=0, rec=0, low=0, wait=0, pub=0;
  var cur=periodOf(PERIOD.unit,PERIOD.back);
  var prv=periodOf(PERIOD.unit,PERIOD.back+1);
  var mNow=0, mPrev=0;
  RATING.forEach(function(v){
    var a=Number(v.avg)||0;
    if(a>=1&&a<=5){ n++; sum+=a; }
    if(String(v.recommend||'').toUpperCase()==='Y') rec++;
    if(a&&a<=3.9) low++;          /* ★ 평균이 3점대 이하인 건 */
    if(v.published) pub++; else wait++;
    /* 고른 기간·직전 기간 평가 도착 — 네 탭이 같은 부품을 쓴다 */
    var d=parseD(v.date||v.made||'');
    if(d && d>=cur.from && d<cur.to) mNow++;
    else if(d && d>=prv.from && d<prv.to) mPrev++;
  });

  /* 공개 중인 후기(숨고 등 포함) */
  var shown=REVIEW.filter(function(v){return v.open!=='N';}).length;
  var hidden=REVIEW.length-shown;

  if(!n && !REVIEW.length){ box.style.display='none'; return; }

  var avg=n?Math.round((sum/n)*10)/10:0;
  var full=Math.round(avg), s='';
  for(var i=0;i<5;i++) s+=(i<full?'★':'☆');

  var h=periodBar(false)+periodTitle(cur,false);
  h+='<div class="big"><span class="stars">'+s+'</span>'
      +'<span class="avg">'+(avg?avg.toFixed(1):'-')+'<small>평가 평균 점수</small></span></div>';
  h+='<div class="ch-title" style="margin:8px 0 2px">'+esc(cur.name)+' 평가 도착 '+mNow+
     '건'+dltHtml(mNow,mPrev)+' · '+esc(prv.name)+' '+mPrev+'건</div>';
  h+='<div class="row">';

  /* ★v10 : 눌러서 걸러볼 수 있게. picked 는 지금 보고 있는 것 */
  var cl=function(k){ return (RVMODE==='new'&&RVFILT===k)?' picked':''; };
  h+='<span class="cell clickable'+cl('all')+'" onclick="rvFilt(\'all\')">총 평가<b>'+n+'건</b></span>';
  h+='<span class="cell clickable'+cl('rec')+'" onclick="rvFilt(\'rec\')">추천<b>'+rec+'명</b></span>';
  h+='<span class="cell clickable'+(low?' warn':'')+cl('low')+'" onclick="rvFilt(\'low\')">평균 3점대<b>'+low+'건</b></span>';
  h+='<span class="cell">공개 후기<b>'+shown+'건</b></span>';
  if(hidden) h+='<span class="cell">숨김<b>'+hidden+'건</b></span>';
  if(wait)   h+='<span class="cell clickable warn'+cl('wait')+'" onclick="rvFilt(\'wait\')">공개 대기<b>'+wait+'건</b></span>';
  h+='</div>';

 * ★v10 — 통계 딱지를 눌러 해당 평가만 보기

 *   wait 아직 손님 화면에 안 올라간 건

var RVFILT='all';

function rvFilt(k){
  RVFILT=k;
  if(RVMODE!=='new'){ setRvMode('new'); return; }
  renderRating(); renderRvStat();
}

function ratingFiltered(){
  return RATING.filter(function(v){
    if(RVFILT==='rec')  return String(v.recommend||'').toUpperCase()==='Y';
    if(RVFILT==='wait') return !v.published;
    if(RVFILT==='low'){
      var a=Number(v.avg)||0;
      return a>0 && a<=3.9;        /* ★ 평균 3점대 이하 */

    return true;
  });
}

function setRvMode(m){

    h+='<div class="meta">';
    h+='<div><span class="mk">연락처</span>'+(v.tel?('<a href="tel:'+String(v.tel).replace(/\D/g,'')+'">'+esc(v.tel)+'</a>'):'<i>없음</i>')+'</div>';
    h+='<div><span class="mk">이사일</span>'+(v.moveDate?esc(fmtDate(v.moveDate)):'<i>없음</i>')+'</div>';
    h+='<div><span class="mk">평가일</span>'+(v.date?esc(fmtDate(v.date)):'<i>없음</i>')+'</div>';
    if(v.kind) h+='<div><span class="mk">이사종류</span>'+esc(v.kind)+'</div>';
    if(v.from) h+='<div><span class="mk">출발</span>'+esc(v.from)+'</div>';

    if(v.recommend) h+='<div><span class="mk">추천의향</span>'+esc(v.recommend)+'</div>';

    if(v.scores&&v.scores.length){

/* ═══════════════════════════════════════════════
   기간 고르기 — 네 탭이 함께 쓴다
   월 · 분기 · 반기 · 연도 중에 고르고, 그 안에서 어느 구간인지 고른다.
   무엇을 고르든 「직전 같은 기간」과 견준다.
   ═══════════════════════════════════════════════ */
var PERIOD = { unit:'month', back:0 };   /* back 0 = 이번, 1 = 직전 */
var STAT_TRIED = 0;   /* 통계 탭에서 자료를 한 번만 부르게 */
/* ★ 무엇을 기준으로 셀지
   접수일 — 이번 달 문의가 얼마나 들어왔나 (마케팅 성적)
   이사일 — 그 달에 일이 얼마나 잡혔나 (일정·인력)
   ERP 는 이사일 기준이므로, 이사일로 맞춰야 숫자를 견줄 수 있다. */
var BASIS = 'in';   /* in = 접수일, move = 이사일 */

/* 기준에 맞는 날짜를 뽑는다 */
/* ═══ 중복 접수 묶기 ═══
   손님이 사진을 더 보내려고 다시 넣으면 두 건이 된다.
   연락처·이사예정일·출발지가 모두 같으면 한 사람으로 본다.
   ★ 원본은 지우지 않는다. 셀 때만 묶고, 목록에는 배지로 알린다. */
function dupKey(r){
  var tel=String(r['연락처']||'').replace(/[^0-9]/g,'');
  if(!tel) return '';
  var dt=String(r['이사예정일']||'').trim();
  var ad=String(r['출발지']||'').replace(/[\s()（）]/g,'').slice(0,30);
  return tel+'|'+dt+'|'+ad;
}
/* 같은 열쇠가 몇 건인지 미리 세어 둔다 */
var DUPMAP={};
function buildDup(){
  DUPMAP={};
  QUOTE.forEach(function(r){
    var k=dupKey(r); if(!k) return;
    DUPMAP[k]=(DUPMAP[k]||0)+1;
  });
}
/* 셀 때 쓰는 목록 — 중복은 첫 건만 남긴다 */
function uniqQuote(){
  var seen={}, out=[];
  QUOTE.forEach(function(r){
    var k=dupKey(r);
    if(!k){ out.push(r); return; }
    if(seen[k]) return;
    seen[k]=1; out.push(r);
  });
  return out;
}

function basisD(r){
  return (BASIS==='move') ? parseD(r['이사예정일']) : parseD(findStamp(r));
}
var BASIS_NAME = { in:'접수일', move:'이사일' };

/* 고른 기간의 시작·끝·이름을 낸다 */
function periodOf(unit, back){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  var from, to, name;
  if(unit==='month'){
    var d=new Date(y, m-back, 1);
    from=d; to=new Date(d.getFullYear(), d.getMonth()+1, 1);
    name=(d.getFullYear()===y?'':d.getFullYear()+'년 ')+(d.getMonth()+1)+'월';
  }else if(unit==='quarter'){
    var q=Math.floor(m/3)-back, qy=y;
    while(q<0){ q+=4; qy--; }
    from=new Date(qy, q*3, 1); to=new Date(qy, q*3+3, 1);
    name=(qy===y?'':qy+'년 ')+(q+1)+'분기';
  }else if(unit==='half'){
    var hh=Math.floor(m/6)-back, hy=y;
    while(hh<0){ hh+=2; hy--; }
    from=new Date(hy, hh*6, 1); to=new Date(hy, hh*6+6, 1);
    name=(hy===y?'':hy+'년 ')+(hh===0?'상반기':'하반기');
  }else{
    var yy=y-back;
    from=new Date(yy,0,1); to=new Date(yy+1,0,1);
    name=yy+'년';
  }
  return { from:from, to:to, name:name };
}

var UNITS=[['month','월'],['quarter','분기'],['half','반기'],['year','연도']];

/* 기간 칩 두 줄을 그린다 — 위는 단위, 아래는 어느 구간 */
function periodBar(withBasis){
  var h='<div class="pbar">';
  /* 기준 줄 — 후기 탭은 평가 도착일뿐이라 기준을 물을 게 없다 */
  if(withBasis!==false){
    h+='<div class="prow bas"><span class="plbl">기준</span>'+
       '<button type="button" class="pchip sm'+(BASIS==='in'?' on':'')+'" data-basis="in">접수일</button>'+
       '<button type="button" class="pchip sm'+(BASIS==='move'?' on':'')+'" data-basis="move">이사일</button></div>';
  }
  h+='<div class="prow">';
  UNITS.forEach(function(u){
    h+='<button type="button" class="pchip'+(PERIOD.unit===u[0]?' on':'')+
       '" data-punit="'+u[0]+'">'+u[1]+'</button>';
  });
  h+='</div><div class="prow sub">';
  for(var i=0;i<6;i++){
    var p=periodOf(PERIOD.unit,i);
    h+='<button type="button" class="pchip sm'+(PERIOD.back===i?' on':'')+
       '" data-pback="'+i+'">'+esc(p.name)+'</button>';
  }
  h+='</div></div>';
  return h;
}

function ymd2(d){ return (d.getMonth()+1)+'/'+d.getDate(); }

/* 「2026년 8월 · 8/1 ~ 8/31」 같은 줄 */
function periodTitle(p, showBasis){
  var last=new Date(p.to.getTime()-86400000);
  var bs = (showBasis===false) ? '' :
    '<span class="bs">'+BASIS_NAME[BASIS]+' 기준</span>';
  return '<div class="range"><b>'+esc(p.name)+'</b><span>'+ymd2(p.from)+' ~ '+ymd2(last)+'</span>'+bs+'</div>';
}

/* 기간 칩 눌렀을 때 — 네 탭 공통 */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.pchip'):null;
  if(!t) return;
  if(t.dataset.basis){ BASIS=t.dataset.basis; }
  else if(t.dataset.punit){ PERIOD.unit=t.dataset.punit; PERIOD.back=0; }
  else if(t.dataset.pback!==undefined){ PERIOD.back=Number(t.dataset.pback); }
  else return;
  try{ renderStats(); }catch(e2){}
  try{ renderReferStats(); }catch(e2){}
  try{ renderRvStat(); }catch(e2){}
});

/* ═══ 네 탭이 함께 쓰는 부품 ═══
   증감 뱃지 — 이번 달과 지난 달을 견준다.
   모양과 자리는 네 탭이 같고, 세는 대상만 탭마다 다르다. */
function dltHtml(now,prev){
  if(prev===null||prev===undefined||isNaN(prev)||prev<=0) return '';
  var df=now-prev;
  if(!df) return '<span class="dlt">· 지난달과 같음</span>';
  var pc=Math.round(df/prev*1000)/10;
  return '<span class="dlt '+(df>0?'up':'dn')+'">'+(df>0?'▲':'▼')+Math.abs(df)+
         ' ('+(df>0?'+':'')+pc+'%)</span>';
}
/* 달 이름 — 「이번달·지난달」은 달이 바뀌면 같은 자리가 다른 달을 뜻한다 */
function monLabel(d){ return (d.getMonth()+1)+'월'; }

/* ═══════════════════════════════════════════════
   통계 탭 — 한 화면에 전체 흐름
   달별 흐름 · 이번달/다음달 · 채널별 표 · 반응 요약
   ═══════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════
   발송 탭 — 발송게이트가 잡아둔 계획
   ─────────────────────────────────────────────────────
   발송게이트는 시트 안에서 스스로 돈다. 여기서는 결과만 본다.
     🔴 팔로우  견적 냈는데 계약이 안 된 건
     🟢 후기    이사 끝난 건
     ⚪ 케어    끝난 지 오래된 건 — 후속서비스 · AS · 재이사
   상태가 「전화만」인 건은 문자를 못 보낸다. 동의가 없고 6개월이 지난 건이다.
   전화는 되므로 명단에서 지우지 않고 따로 보여준다.
   ═══════════════════════════════════════════════════════ */

var BOTMARK={'팔로우':{c:'#E24B4A',t:'오늘 안 하면 매출이 날아간다'},

  if(!wait.length&&!only.length){
    h+='<div class="soon"><div class="big">예정된 발송이 없습니다</div>'
      +'시트에서 [발송게이트] → [② 발송계획 세우기] 를 눌러 주세요.</div>';
    el.innerHTML=h; return;
  }

  /* ★ 달력 — 이번 달과 다음 달 */
  h+=gateCal(wait);

  /* 고른 날의 명단이 여기 들어간다 */
  h+='<div id="gate-day"></div>';

  if(only.length){
    h+='<div style="font-size:15px;font-weight:800;color:var(--muted);margin:18px 0 8px">문자 불가 '+only.length+'건 — 전화로만 가능</div>';
    h+='<div class="card">';
    only.slice(0,30).forEach(function(r){ h+=gateLine(r); });
    if(only.length>30) h+='<div style="font-size:14px;color:var(--muted);padding-top:4px">… 외 '+(only.length-30)+'명</div>';
    h+='</div>';
  }

  el.innerHTML=h;
  var c=document.getElementById('cnt-gate');
  if(c) c.textContent=wait.length||'–';

  /* 가장 가까운 날을 먼저 펼쳐 둔다 */
  var days=Object.keys(wait.reduce(function(a,r){a[r.date]=1;return a;},{})).sort();
  if(days.length) gateDay(days[0]);
}

var GATE_ROWS=[];

/* ★ 달력 — 날짜 칸에 건수를 찍는다. 누르면 그날 명단이 아래 뜬다. */
function gateCal(wait){
  var byDay={};
  wait.forEach(function(r){ (byDay[r.date]=byDay[r.date]||[]).push(r); });
  var days=Object.keys(byDay).sort();
  if(!days.length) return '';

  var first=new Date(days[0].slice(0,4), Number(days[0].slice(5,7))-1, 1);
  var last =new Date(days[days.length-1].slice(0,4), Number(days[days.length-1].slice(5,7))-1, 1);
  var months=[]; var cur=new Date(first);
  while(cur<=last && months.length<4){ months.push(new Date(cur)); cur.setMonth(cur.getMonth()+1); }

  var WD=['일','월','화','수','목','금','토'];
  var h='';
  months.forEach(function(m){
    var y=m.getFullYear(), mo=m.getMonth();
    var start=new Date(y,mo,1).getDay();
    var end=new Date(y,mo+1,0).getDate();
    h+='<div class="card" style="margin-bottom:10px">';
    h+='<div style="font-size:16.5px;font-weight:800;color:var(--navy);margin-bottom:8px">'+y+'년 '+(mo+1)+'월</div>';
    h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
    WD.forEach(function(w,i){
      h+='<div style="text-align:center;font-size:12.5px;font-weight:700;padding:3px 0;color:'
        +(i===0?'#E24B4A':(i===6?'#3B6FD4':'var(--muted)'))+'">'+w+'</div>';
    });
    for(var k=0;k<start;k++) h+='<div></div>';
    for(var d=1;d<=end;d++){
      var key=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var n=(byDay[key]||[]).length;
      var on=n>0;
      h+='<div'+(on?' onclick="gateDay(\''+key+'\')"':'')
        +' style="text-align:center;padding:6px 2px;border-radius:8px;cursor:'+(on?'pointer':'default')
        +';background:'+(on?'#EAF2FF':'transparent')+';border:1px solid '+(on?'#C7DBFF':'transparent')+'">'
        +'<div style="font-size:13.5px;font-weight:'+(on?'800':'400')+';color:'+(on?'var(--navy)':'#BBB')+'">'+d+'</div>'
        +(on?'<div style="font-size:11.5px;color:#3B6FD4;font-weight:800">'+n+'</div>':'<div style="height:14px"></div>')
        +'</div>';
    }
    h+='</div></div>';
  });
  return h;
}

/* 하루 명단 — 달력에서 날짜를 누르면 여기 뜬다 */
function gateDay(key){
  var box=document.getElementById('gate-day');
  if(!box) return;
  var arr=GATE_ROWS.filter(function(r){return r.date===key&&r.state==='대기';});
  if(!arr.length){ box.innerHTML=''; return; }
  var h='<div class="card" style="border:1.5px solid #C7DBFF">';
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
    +'<b style="font-size:16.5px;color:var(--navy)">'+dmd(key)+'</b>'
    +'<span style="font-size:14px;color:var(--muted);font-weight:800">'+arr.length+'명</span></div>';
  arr.forEach(function(r){ h+=gateLine(r); });
  h+='</div>';
  box.innerHTML=h;
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ★ 고객 한 줄 — 전화가 왔을 때 누군지 알 수 있어야 한다 */
function gateLine(r){
  var m=BOTMARK[r.bot]||{c:'#888'};
  var h='<div style="padding:8px 0;border-top:1px solid #EEF1F6">';
  h+='<div style="display:flex;align-items:center;gap:7px;font-size:15px">'
    +'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+m.c+';flex:none"></span>'
    +'<b>'+esc(r.rule)+'</b>'
    +'<a href="tel:'+esc(r.phone)+'" style="color:var(--navy);font-weight:700;text-decoration:none">'+esc(r.phone)+'</a>';
  if(String(r.state).indexOf('전화만')===0)
    h+='<span style="font-size:12.5px;color:#E24B4A;font-weight:800">전화만</span>';
  h+='</div>';
  var l2=[r.move, (r.from||'')+(r.to?' → '+r.to:'')].filter(Boolean).join('  ');
  if(l2.trim()) h+='<div style="font-size:14px;color:var(--muted);padding-left:15px">'+esc(l2)+'</div>';
  var amt=r.amt?Number(String(r.amt).replace(/[^0-9]/g,'')).toLocaleString()+'원':'';
  var l3=[r.route,amt].filter(Boolean).join('  ');
  if(l3.trim()) h+='<div style="font-size:14px;color:var(--muted);padding-left:15px">'+esc(l3)+'</div>';
  if(r.prev) h+='<div style="font-size:13.5px;color:#1D9E75;font-weight:700;padding-left:15px">※ 이전 '+esc(r.prev)+'</div>';
  h+='</div>';
  return h;
}

function statBody(){
  var box=document.getElementById('pane-stat'); if(!box) return;
  if(!QUOTE.length){
    box.innerHTML='<div class="soon"><div class="big">견적 자료를 읽는 중입니다…</div>'+
      '몇 초 뒤에도 그대로면 아래를 눌러 주세요.'+
      '<div style="margin-top:14px"><button class="a main" onclick="STAT_TRIED=0;renderStatTab()">다시 시도</button></div></div>';
    if(!STAT_TRIED){ STAT_TRIED=1; try{ loadQuote(); }catch(e){} }
    return;
  }

  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  var M=function(k){ return new Date(y, m+k, 1); };
  var lbl=function(d){ return (d.getMonth()+1)+'월'; };
  var UQ=uniqQuote();   /* 중복 접수를 한 건으로 묶은 목록 */

  /* ═══ ① 이사 예정 문의 — 본체.
     「9월에 이사할 분이 몇 명 문의했나」가 매일 보는 숫자다 ═══ */
  var plan=[];
  for(var j=-1;j<=2;j++){
    var f=M(j), t=M(j+1), n=0, ch={};
    UQ.forEach(function(r){
      var d=parseD(r['이사예정일']);
      if(d && d>=f && d<t){ n++; var w=r._main||'기타'; ch[w]=(ch[w]||0)+1; }
    });
    plan.push({ k:j, name:lbl(f), n:n, ch:ch });
  }
  var h='';
  h+='<div class="card"><div class="sth">이사 예정 문의</div>'+
     '<div class="sts">이사일 기준</div><div class="plan4">';
  plan.forEach(function(o){
    h+='<div class="pcard'+(o.k===0?' now':'')+'">'+
       '<div class="pm">'+o.name+'</div><div class="pn">'+o.n+'<em>건</em></div></div>';
  });
  h+='</div></div>';

  /* ═══ ② 모집구분 — 세 달을 나란히. 건수 위, 비율 아래 ═══ */
  var show=[];
  plan.forEach(function(o){ if(o.k>=0) show.push(o); });   /* 이번달·다음달·다다음달 */
  var chset={};
  show.forEach(function(o){ Object.keys(o.ch).forEach(function(k){ chset[k]=(chset[k]||0)+o.ch[k]; }); });
  var keys=Object.keys(chset).sort(function(a,b){ return chset[b]-chset[a]; });

  h+='<div class="card"><div class="sth">모집구분별 · 이사 예정</div>'+
     '<div class="sts">건수 아래는 그 달에서 차지하는 몫</div>';
  if(!keys.length){
    h+='<div class="soon">이사 예정 문의가 없습니다.</div>';
  }else{
    h+='<table class="ctab2"><tr><th>모집구분</th>';
    show.forEach(function(o){ h+='<th>'+o.name+'</th>'; });
    h+='</tr>';
    keys.forEach(function(c){
      h+='<tr><td class="nm">'+esc(c)+'</td>';
      show.forEach(function(o){
        var n=o.ch[c]||0;
        if(!n){ h+='<td class="z">–</td>'; return; }
        var pc=Math.round(n/o.n*100);
        /* 표본이 적으면 비율이 튄다 — 흐리게 해서 알 수 있게 */
        var thin=(o.n<10)?' thin':'';
        h+='<td><b>'+n+'</b><i class="pc'+thin+'">('+pc+'%)</i></td>';
      });
      h+='</tr>';
    });
    h+='<tr class="sum"><td class="nm">합계</td>';
    show.forEach(function(o){ h+='<td><b>'+o.n+'</b></td>'; });
    h+='</tr></table>';
    var few=show.filter(function(o){ return o.n>0 && o.n<10; });
    if(few.length){
      h+='<div class="sts" style="margin:10px 0 0">'+
         few.map(function(o){return o.name;}).join(' · ')+
         ' 은 아직 건수가 적어 몫이 크게 흔들립니다</div>';
    }
  }
  h+='</div>';

  /* ═══ ③ 월별 문의 — 접수일 기준. 곁가지이므로 아래로 ═══ */
  var all=[], mx=0;
  for(var i=11;i>=0;i--){
    var f2=M(-i), t2=M(-i+1), n2=0;
    UQ.forEach(function(r){
      var d=parseD(findStamp(r));
      if(d && d>=f2 && d<t2) n2++;
    });
    all.push({ name:lbl(f2), n:n2 });
  }
  var first=-1;
  for(var k2=0;k2<all.length;k2++){ if(all[k2].n>0){ first=k2; break; } }
  var months=(first<0)?[]:all.slice(first);
  months.forEach(function(o){ if(o.n>mx) mx=o.n; });

  h+='<div class="card"><div class="sth">월별 문의</div><div class="sts">접수일 기준 · 언제 문의가 들어왔나</div>';
  if(!months.length){
    h+='<div class="soon">아직 기록이 없습니다.</div>';
  }else{
    h+='<div class="hgraph">';
    months.forEach(function(o){
      var hh=mx? Math.round(o.n/mx*110):0;
      h+='<div class="hgcol'+(o.n?'':' zero')+'"><div class="v">'+o.n+'</div>'+
         '<div class="bar" style="height:'+hh+'px"></div></div>';
    });
    h+='</div><div class="hglbl">';
    months.forEach(function(o){ h+='<div>'+o.name+'</div>'; });
    h+='</div>';
    if(months.length>=2){
      var L=months[months.length-1], P=months[months.length-2];
      h+='<div class="stnote">'+L.name+' '+L.n+'건'+dltHtml(L.n,P.n)+'</div>';
    }
  }
  h+='</div>';

  box.innerHTML=h;
}

/* 통계 — 채널별은 대분류로 묶음 */
function renderStats(){

  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  /* 실적은 달력 단위로 센다 — 「최근 30일」로 세면 지난달이 섞여 정산이 안 된다 */

  });

    h+='</div>';
  }
  document.getElementById('stats').innerHTML=h;
}

function findStamp(r){
  var names=['접수시각','타임스탬프','Timestamp','등록일','접수일','접수일시','제출시각'];
  for(var i=0;i<names.length;i++){ if(r[names[i]]) return r[names[i]]; }
  for(var k in r){
    var v=String(r[k]||'');
    if(/\d{4}[.\-\/]\s*\d{1,2}[.\-\/]\s*\d{1,2}.*(오전|오후|\d{1,2}:\d{2})/.test(v)) return v;
  }
  return '';
}

function parseD(v){
  if(!v) return null;
  v=String(v).trim();
  var m=v.match(/(\d{4})[-.\/]\s*(\d{1,2})[-.\/]\s*(\d{1,2})/);
  if(m){ var yy=+m[1]; if(yy<2000) return null; return new Date(yy,+m[2]-1,+m[3]); }
  var d=new Date(v);
  if(!isNaN(d.getTime())){ if(d.getFullYear()<2000) return null; return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  return null;
}

/* ★v2 유입경로 칩 — 1단 대분류, 2단 상세 */
function buildSubtabs(){
  var ways={};
  QUOTE.forEach(function(r){ var w=r._main||'기타'; ways[w]=(ways[w]||0)+1; });
  var order=Object.keys(ways).sort(function(a,b){return ways[b]-ways[a];});
  var h='<button class="st '+(FILTER==='all'?'on':'')+'" onclick="setFilter(\'all\')">전체 '+QUOTE.length+'</button>';
  order.forEach(function(w){
    h+='<button class="st '+(FILTER===w?'on':'')+'" onclick="setFilter(\''+jsq(w)+'\')">'+esc(w)+' '+ways[w]+'</button>';
  });
  document.getElementById('subtabs').innerHTML=h;
  buildSubtabs2();
}

function buildSubtabs2(){
  var box=document.getElementById('subtabs2');
  if(FILTER==='all'){ box.classList.add('hide'); box.innerHTML=''; return; }
  var det={};
  QUOTE.forEach(function(r){
    if((r._main||'기타')!==FILTER) return;
    var d=r._detail||'(미기재)';
    det[d]=(det[d]||0)+1;
  });
  var keys=Object.keys(det);
  /* 상세가 '(미기재)' 하나뿐이면 2단은 의미 없음 */
  if(keys.length<=1 && keys[0]==='(미기재)'){ box.classList.add('hide'); box.innerHTML=''; return; }
  keys.sort(function(a,b){return det[b]-det[a];});
  var total=0; keys.forEach(function(k){total+=det[k];});
  var lbl = (FILTER==='지인소개') ? '소개해 주신 분' : (FILTER==='부동산소개' ? '부동산' : '상세');
  var h='<div class="lbl2">'+esc(FILTER)+' '+total+'건 · '+esc(lbl)+'별</div>';
  h+='<button class="st2 '+(FILTER2==='all'?'on':'')+'" onclick="setFilter2(\'all\')">전체 '+total+'</button>';
  keys.forEach(function(k){
    h+='<button class="st2 '+(FILTER2===k?'on':'')+'" onclick="setFilter2(\''+jsq(k)+'\')">'+esc(k)+' '+det[k]+'</button>';
  });
  box.innerHTML=h;
  box.classList.remove('hide');
}

function setFilter(f){ FILTER=f; FILTER2='all'; SHOWN=PAGE; buildSubtabs(); renderQuote(); }
function setFilter2(f){ FILTER2=f; SHOWN=PAGE; buildSubtabs2(); renderQuote(); }

function onSearch(){
  SEARCH=(document.getElementById('q').value||'').trim().toLowerCase();
  document.getElementById('qClear').classList.toggle('hide', !SEARCH);
  SHOWN=PAGE; renderQuote();
}
function clearSearch(){
  document.getElementById('q').value=''; SEARCH='';
  document.getElementById('qClear').classList.add('hide');
  SHOWN=PAGE; renderQuote();
}
function matchSearch(r){
  if(!SEARCH) return true;
  var hay=[
    r['연락처'], fmtDate(r['이사예정일']), r['이사예정일'],
    r['출발지'], r['도착지'], r._main, r._detail, r['소개자성함'], r['소개자연락처'],
    r['이사종류'], r['견적방식'], fmtDate(r['견적희망일'])
  ].join(' ').toLowerCase();
  var digitsQ=SEARCH.replace(/[^0-9]/g,'');
  if(digitsQ){
    var digitsH=hay.replace(/[^0-9]/g,'');
    if(digitsH.indexOf(digitsQ)>=0) return true;
  }
  return hay.indexOf(SEARCH)>=0;
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtDate(v){
  if(!v) return '';
  var s=String(v).trim();
  var m=s.match(/(\d{4})[-.\/]\s*(\d{1,2})[-.\/]\s*(\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  var d=new Date(s);
  if(!isNaN(d.getTime())){
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  }
  return s;
}
function fmtStamp(v){
  var s=String(v||'').replace(/\s+/g,' ').trim();
  if(!s) return '';
  if(/\d{4}[.\-]\s*\d{1,2}[.\-]/.test(s) && !/[A-Za-z]{3}/.test(s)) return s;
  var d=new Date(s);
  if(!isNaN(d.getTime())){
    var yy=d.getFullYear(), mm=('0'+(d.getMonth()+1)).slice(-2), dd=('0'+d.getDate()).slice(-2);
    var H=d.getHours(), M=('0'+d.getMinutes()).slice(-2);
    var ap=H<12?'오전':'오후'; var h12=H%12; if(h12===0)h12=12;
    return yy+'-'+mm+'-'+dd+' '+ap+' '+h12+':'+M;
  }
  return s;
}
function fmtTime(v){
  if(!v) return '';
  var s=String(v).trim();
  if(/^[가-힣0-9:\s시분오전후]+$/.test(s) && s.length<12) return s;
  var m=s.match(/(\d{1,2}):(\d{2})/);
  if(m){ var H=+m[1]; var ap=H<12?'오전':'오후'; var h12=H%12; if(h12===0)h12=12; return ap+' '+h12+'시'+(m[2]!=='00'?' '+m[2]+'분':''); }
  return s;
}

/* 카드 렌더 */
function renderQuote(){
  var full = QUOTE.filter(function(r){
    var okWay = (FILTER==='all') || ((r._main||'기타')===FILTER);
    var okDet = (FILTER2==='all') || ((r._detail||'(미기재)')===FILTER2);
    return okWay && okDet && matchSearch(r);
  });
  document.getElementById('quoteCnt').textContent = full.length+'건';

  if(!full.length){
    document.getElementById('quoteList').innerHTML='<div class="empty"><div class="big">찾는 견적이 없습니다</div>검색어를 지우면 전체가 다시 보입니다.</div>';
    return;
  }

  var list = full.slice(0, SHOWN);
  var h='';
  list.forEach(function(r){
    var g=function(k){return r[k]?String(r[k]).trim():'';};
    var mode=g('견적방식');
    var 대면=(mode==='대면');
    var from=g('출발지')+(g('출발지층')?' '+g('출발지층')+'층':'');
    var to=g('도착지')+(g('도착지층')?' '+g('도착지층')+'층':'')+(g('도착지평형')?' '+g('도착지평형')+'평':'');
    var 버릴=[g('폐기가구_방별'),g('폐기가구_기타')].filter(Boolean).join(' / ');
    var i=QUOTE.indexOf(r);

    h+='<div class="card">';
    h+='<div class="chead">';
    h+='<span class="way" style="'+wayStyle(r._main)+'">'+esc(r._main||'경로미상')+'</span>';
    h+='<span class="mode'+(대면?'':' f')+'">'+esc(mode||'—')+'</span>';
    h+='<span class="tel">'+esc(g('연락처'))+'</span>';
    h+='<span class="when">'+esc(fmtStamp(g('접수시각')))+'</span>';
    /* 같은 손님이 두 번 넣은 건 — 지우지 않고 알리기만 한다.
       사진을 나눠 보냈을 수 있으므로 대표가 보고 판단한다 */
    var dk=dupKey(r), dn=dk?(DUPMAP[dk]||1):1;
    if(dn>1) h+='<span class="dupb">같은 손님 '+dn+'건</span>';
    h+='</div>';

    h+='<div class="move">이사 '+esc(fmtDate(g('이사예정일'))||'미정')+(g('날짜조절가능')==='예'?' (조절가능)':'')+(g('이사종류')?' · '+esc(g('이사종류')):'')+'</div>';
    var 방문=[fmtDate(g('견적희망일')),g('견적희망시간대'),fmtTime(g('견적희망시각'))].filter(Boolean).join(' ');
    if(방문) h+='<div class="route">방문 '+esc(방문)+(g('방문일시방식')?' <span class="cond">('+esc(g('방문일시방식'))+')</span>':'')+'</div>';

    h+='<div class="rows">';
    h+='<div class="kv"><span class="k">출발</span>'+esc(from)+(g('출발지작업조건')?' <span class="cond">('+esc(g('출발지작업조건'))+')</span>':'')+'</div>';
    h+='<div class="kv"><span class="k">도착</span>'+esc(to)+(g('도착지작업조건')?' <span class="cond">('+esc(g('도착지작업조건'))+')</span>':'')+'</div>';
    if(g('도착지공실')) h+='<div class="kv"><span class="k">비는시기</span>'+esc(g('도착지공실'))+'</div>';
    if(g('붙박이장')) h+='<div class="kv"><span class="k">붙박이장</span>'+esc(g('붙박이장'))+'</div>';
    if(버릴) h+='<div class="kv"><span class="k">버릴것</span>'+esc(버릴)+'</div>';
    if(g('사진요약')) h+='<div class="kv"><span class="k">사진</span>'+esc(g('사진요약'))+'</div>';
    h+='</div>';

    /* ★v2 소개자 줄 */
    if(r._detail){
      var lbl = (r._main==='지인소개') ? '소개해주신 분' : (r._main==='부동산소개' ? '부동산' : '상세');
      var tel2=String(g('소개자연락처')||'').replace(/\D/g,'');
      h+='<div class="refline">'+esc(lbl)+' : '+esc(r._detail)
        +(tel2?' &nbsp;<a href="tel:'+tel2+'" style="color:#4B3690">전화</a>':'')+'</div>';
    }

    if(g('미촬영공간')) h+='<div class="warn">사진 없음 : '+esc(g('미촬영공간'))+'</div>';
    if(g('특이사항')) h+='<div class="note">'+esc(g('특이사항'))+'</div>';
    if(r['사진폴더URL']) h+='<div class="photo"><a href="'+esc(r['사진폴더URL'])+'" target="_blank">사진폴더 열기</a></div>';

    h+='<div class="acts">';
    h+='<button class="a main" id="cp'+i+'" onclick="copyAll('+i+')">전체 복사 (메모란용)</button>';
    h+='<a class="a tel" style="text-decoration:none" href="tel:'+g('연락처').replace(/\D/g,'')+'">전화</a>';
    h+='</div>';

    h+='<div class="acts">';
    h+='<button class="a draft" id="dr'+i+'" onclick="copyDraft('+i+')">답문 초안 복사 (고객 발송용)</button>';
    h+='</div>';

    h+='<div class="chips2">';
    if(g('연락처')) h+='<button class="cc" onclick="copyOne(this,\''+jsq(g('연락처'))+'\')">연락처</button>';
    if(from) h+='<button class="cc" onclick="copyOne(this,\''+jsq(from)+'\')">출발지</button>';
    if(to) h+='<button class="cc" onclick="copyOne(this,\''+jsq(to)+'\')">도착지</button>';
    if(g('도착지평형')) h+='<button class="cc" onclick="copyOne(this,\''+jsq(g('도착지평형'))+'\')">평수</button>';
    if(g('이사예정일')) h+='<button class="cc" onclick="copyOne(this,\''+jsq(fmtDate(g('이사예정일')))+'\')">이사일</button>';
    h+='</div>';

    h+='</div>';
  });
  if(full.length > SHOWN){
    h+='<div style="text-align:center;padding:8px 0 20px">'
      +'<button onclick="showMore()" style="border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:12px 22px;font-size:16.5px;font-weight:800;cursor:pointer;font-family:inherit">'
      +'더 보기 (남은 '+(full.length-SHOWN)+'건)</button></div>';
  }
  document.getElementById('quoteList').innerHTML=h;
}

function showMore(){ SHOWN+=PAGE; renderQuote(); }

function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function buildLine(r){
  var g=function(k){return r[k]?String(r[k]).trim():'';};
  var L=[];
  var line=function(label,val){ if(val) L.push(label+': '+val); };
  var 대면=(g('견적방식')==='대면');
  var 방문=[fmtDate(g('견적희망일')),g('견적희망시간대'),fmtTime(g('견적희망시각'))].filter(Boolean).join(' ');
  if(대면&&방문) L.push('▶ 방문 '+방문+(g('방문일시방식')?' ('+g('방문일시방식')+')':''));
  L.push('▶ 이사 '+(fmtDate(g('이사예정일'))||'미정')+(g('날짜조절가능')==='예'?' (조절가능)':''));
  line('유입',r._main);
  line('  상세',r._detail);
  line('방식',g('견적방식'));
  line('연락처',g('연락처'));
  line('이사종류',g('이사종류'));
  L.push('');
  line('출발',g('출발지')+(g('출발지층')?' '+g('출발지층')+'층':''));
  line('  조건',g('출발지작업조건'));
  line('도착',g('도착지')+(g('도착지층')?' '+g('도착지층')+'층':'')+(g('도착지평형')?' '+g('도착지평형')+'평':''));
  line('  조건',g('도착지작업조건'));
  line('  비는시기',g('도착지공실'));
  L.push('');
  line('붙박이장',g('붙박이장'));
  var 버릴=[g('폐기가구_방별'),g('폐기가구_기타')].filter(Boolean).join(' / ');
  line('버릴것',버릴);
  line('특이사항',g('특이사항'));
  line('사진',g('사진요약'));
  line('미촬영',g('미촬영공간'));
  return L.join('\n');
}

function buildDraft(r){
  var g=function(k){return r[k]?String(r[k]).trim():'';};
  var 대면=(g('견적방식')==='대면');
  var L=[];
  L.push('안녕하세요 고객님, [해피데이익스프레스]입니다.');
  L.push(대면?'방문견적 신청해 주셔서 감사합니다.':'보내주신 사진 잘 받았습니다.');
  L.push('');
  L.push('■ 이렇게 접수되었습니다');
  L.push('이사 '+(fmtDate(g('이사예정일'))||'미정')+(g('이사종류')?' · '+g('이사종류'):''));
  L.push(g('출발지')+(g('출발지층')?' '+g('출발지층')+'층':'')+(g('출발지작업조건')?' ('+g('출발지작업조건')+')':''));
  L.push(' → '+g('도착지')+(g('도착지층')?' '+g('도착지층')+'층':'')+(g('도착지작업조건')?' ('+g('도착지작업조건')+')':''));
  L.push('');
  if(대면){
    var when=[fmtDate(g('견적희망일')),g('견적희망시간대'),fmtTime(g('견적희망시각'))].filter(Boolean).join(' ');
    if(when){ L.push('■ 방문견적 일시'); L.push(when); L.push(''); }
    L.push('■ 방문해서 짐량과 작업조건을 확인한 뒤');
    L.push('   확정가로 안내해 드립니다');
    L.push('확정 후 당일 추가금은 없습니다.');
  } else {
    L.push('■ 짐량은 [   ]톤으로 파악됩니다');
    L.push('작업원 남[  ], 여[  ] 투입');
    L.push('비용은 [    ]만원 예상됩니다.');
    L.push('');
    L.push('사다리차 진입 등 작업조건은 전화로 한 번 더');
    L.push('확인한 뒤 확정가로 안내해 드리겠습니다.');
  }
  L.push('');
  if(!대면){
    L.push('■ 입주청소는 서비스로 해드립니다');
    L.push('전문 청소팀 3명이 진행합니다.');
    L.push('창문 유리와 천장 등기구를 제외한 나머지를');
    L.push('전부 해드립니다.');
    L.push('따로 맡기시면 약 [   ]만원인 작업입니다.');
    L.push('');
    var ask=[];
    if(g('미촬영공간')) ask.push('· '+g('미촬영공간')+' 사진도 한 장씩 부탁드려요');
    var 도착조건=g('도착지작업조건');
    if(!도착조건||도착조건.indexOf('모름')>=0){
      ask.push('· 가시는 집에 사다리차가 들어갈 수 있는지');
      ask.push('  관리사무소나 공인중개사에 확인해서 알려주세요');
      ask.push('  (엘리베이터 / 사다리차 / 계단 중 어느 쪽인지)');
    }
    if(!g('폐기가구_방별')&&!g('폐기가구_기타')) ask.push('· 버리고 가실 가구가 있으신가요?');
    if(!g('도착지평형')) ask.push('· 가시는 집 평수를 알려주세요 (청소 준비용)');
    if(ask.length){ L.push('■ 확인 부탁드립니다'); L=L.concat(ask); L.push(''); }
    L.push('■ 확인되면 확정가로 안내해 드리겠습니다');
    L.push('확정 후 당일 추가금은 없습니다.');
    L.push('');
  }
  if(대면){
    L.push('출발 전에 전화드리고 찾아뵙겠습니다.');
    L.push('일정이 변경되시면 미리 연락 주세요.');
    L.push('');
  }
  L.push('궁금하신 점은 010-6407-2424로 전화 주세요.');
  return L.join('\n');
}

function copyDraft(i){
  var txt=buildDraft(QUOTE[i]);
  doCopy(txt);
  var b=document.getElementById('dr'+i);
  b.classList.add('copied'); var o=b.textContent;
  b.textContent='✓ 답문 복사됨 — 고객에게 붙여넣기';
  setTimeout(function(){ b.classList.remove('copied'); b.textContent=o; },1800);
}
function copyAll(i){
  var txt=buildLine(QUOTE[i]);
  doCopy(txt);
  var b=document.getElementById('cp'+i);
  b.classList.add('copied'); var o=b.textContent;
  b.textContent='✓ 복사됐습니다 — 메모란에 붙여넣기';
  setTimeout(function(){ b.classList.remove('copied'); b.textContent=o; },1800);
}
function copyOne(btn,txt){
  doCopy(txt);
  btn.classList.add('copied'); var o=btn.textContent;
  btn.textContent='✓';
  setTimeout(function(){ btn.classList.remove('copied'); btn.textContent=o; },1200);
}
function doCopy(txt){
  if(navigator.clipboard){ navigator.clipboard.writeText(txt); return; }
  var t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t);
  t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t);
}
tryAutoLogin();
